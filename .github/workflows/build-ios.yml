name: 构建未签名 IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      EXPECTED_BUNDLE_ID: com.yuyanfriends.app

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 生成 Xcode 工程
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sips -z 1024 1024 \
            CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon-Source.png \
            --out CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          xcodegen generate --spec project.yml
          xcodebuild -project CustomerServiceApp.xcodeproj -scheme CustomerServiceApp -showBuildSettings >/dev/null

      - name: 编译未签名 App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CustomerServiceApp.xcodeproj \
            -scheme CustomerServiceApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            clean build \
            PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: 封装未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$APP_PATH" ]]

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          PACKAGE_ROOT="$RUNNER_TEMP/unsigned-package"
          mkdir -p "$PACKAGE_ROOT/Payload" build/ipa
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/CustomerServiceApp.app"
          (
            cd "$PACKAGE_ROOT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ipa/CustomerService-iOS-1.0.8-unsigned.ipa" Payload
          )

      - name: 校验未签名状态和包名
        shell: bash
        run: |
          set -euo pipefail
          FINAL_IPA="build/ipa/CustomerService-iOS-1.0.8-unsigned.ipa"
          [[ -f "$FINAL_IPA" ]]

          VERIFY_DIR="$RUNNER_TEMP/verify-unsigned-ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$FINAL_IPA" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$APP_PATH" ]]
          [[ ! -e "$APP_PATH/_CodeSignature" ]]
          [[ ! -e "$APP_PATH/embedded.mobileprovision" ]]
          [[ -x "$APP_PATH/CustomerServiceApp" ]]

          if codesign --verify --deep --strict "$APP_PATH" >/dev/null 2>&1; then
            echo "错误：App 仍然带有有效签名。"
            exit 1
          fi

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          [[ "$ACTUAL_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]]

          shasum -a 256 "$FINAL_IPA" > "$FINAL_IPA.sha256.txt"
          {
            echo "bundle_id=$ACTUAL_BUNDLE_ID"
            echo "signed=false"
            echo "embedded_profile=false"
            echo "git_commit=$GITHUB_SHA"
          } > build/ipa/build-info.txt

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomerService-iOS-1.0.8-unsigned
          path: build/ipa/
          if-no-files-found: error
          retention-days: 30

