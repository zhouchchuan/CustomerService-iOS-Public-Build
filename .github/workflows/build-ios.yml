name: 构建爱思兼容待重签 IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-resignable-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-resignable-ipa:
    name: 编译爱思兼容待重签 IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      EXPECTED_BUNDLE_ID: com.yuyanfriends.app

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 生成 Xcode 工程
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sips -z 1024 1024 \
            CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon-Source.png \
            --out CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          xcodegen generate --spec project.yml
          xcodebuild -project CustomerServiceApp.xcodeproj -scheme CustomerServiceApp -showBuildSettings >/dev/null

      - name: 编译未签名 App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CustomerServiceApp.xcodeproj \
            -scheme CustomerServiceApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            clean build \
            PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: 封装未签名和占位签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$APP_PATH" ]]

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          UNSIGNED_ROOT="$RUNNER_TEMP/unsigned-package"
          RESIGNABLE_ROOT="$RUNNER_TEMP/resignable-package"
          mkdir -p "$UNSIGNED_ROOT/Payload" "$RESIGNABLE_ROOT/Payload" build/ipa
          ditto "$APP_PATH" "$UNSIGNED_ROOT/Payload/CustomerServiceApp.app"
          ditto "$APP_PATH" "$RESIGNABLE_ROOT/Payload/CustomerServiceApp.app"

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$RESIGNABLE_ROOT/Payload/CustomerServiceApp.app"

          (
            cd "$UNSIGNED_ROOT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ipa/CustomerService-iOS-1.0.9-unsigned.ipa" Payload
          )
          (
            cd "$RESIGNABLE_ROOT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ipa/CustomerService-iOS-1.0.9-resignable.ipa" Payload
          )

      - name: 校验包结构、占位签名和包名
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_IPA="build/ipa/CustomerService-iOS-1.0.9-unsigned.ipa"
          RESIGNABLE_IPA="build/ipa/CustomerService-iOS-1.0.9-resignable.ipa"
          [[ -f "$UNSIGNED_IPA" ]]
          [[ -f "$RESIGNABLE_IPA" ]]

          UNSIGNED_VERIFY_DIR="$RUNNER_TEMP/verify-unsigned-ipa"
          RESIGNABLE_VERIFY_DIR="$RUNNER_TEMP/verify-resignable-ipa"
          mkdir -p "$UNSIGNED_VERIFY_DIR" "$RESIGNABLE_VERIFY_DIR"
          unzip -q "$UNSIGNED_IPA" -d "$UNSIGNED_VERIFY_DIR"
          unzip -q "$RESIGNABLE_IPA" -d "$RESIGNABLE_VERIFY_DIR"
          UNSIGNED_APP=$(find "$UNSIGNED_VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          RESIGNABLE_APP=$(find "$RESIGNABLE_VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$UNSIGNED_APP" ]]
          [[ -n "$RESIGNABLE_APP" ]]
          [[ ! -e "$UNSIGNED_APP/_CodeSignature" ]]
          [[ ! -e "$UNSIGNED_APP/embedded.mobileprovision" ]]
          [[ -e "$RESIGNABLE_APP/_CodeSignature/CodeResources" ]]
          [[ ! -e "$RESIGNABLE_APP/embedded.mobileprovision" ]]
          [[ -x "$UNSIGNED_APP/CustomerServiceApp" ]]
          [[ -x "$RESIGNABLE_APP/CustomerServiceApp" ]]

          if codesign --verify --deep --strict "$UNSIGNED_APP" >/dev/null 2>&1; then
            echo "错误：App 仍然带有有效签名。"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$RESIGNABLE_APP"

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RESIGNABLE_APP/Info.plist")
          ACTUAL_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RESIGNABLE_APP/Info.plist")
          [[ "$ACTUAL_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]]
          [[ "$ACTUAL_EXECUTABLE" == "CustomerServiceApp" ]]

          shasum -a 256 "$UNSIGNED_IPA" > "$UNSIGNED_IPA.sha256.txt"
          shasum -a 256 "$RESIGNABLE_IPA" > "$RESIGNABLE_IPA.sha256.txt"
          {
            echo "bundle_id=$ACTUAL_BUNDLE_ID"
            echo "bundle_executable=$ACTUAL_EXECUTABLE"
            echo "marketing_version=1.0.9"
            echo "build_number=4"
            echo "unsigned_ipa_signed=false"
            echo "resignable_ipa_signature=ad-hoc-placeholder"
            echo "embedded_profile=false"
            echo "git_commit=$GITHUB_SHA"
          } > build/ipa/build-info.txt

      - name: 上传待重签 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomerService-iOS-1.0.9-resignable
          path: build/ipa/
          if-no-files-found: error
          retention-days: 30

