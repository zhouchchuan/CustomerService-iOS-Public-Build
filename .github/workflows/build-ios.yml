name: 构建真机 IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: 编译并签名 Ad Hoc IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      EXPECTED_BUNDLE_ID: com.yuyanfriends.app
      EXPECTED_TEAM_ID: XTGL9G753G
      EXPECTED_PROFILE_UUID: 01e46bdf-dd14-4c2b-aa51-5f8b958161f4
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 检查签名 Secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$BUILD_PROVISION_PROFILE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "缺少 iOS 签名 Secrets。"
            exit 1
          fi

      - name: 安装签名证书和描述文件
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/build-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/customer-service-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"
          APS_ENVIRONMENT=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")

          [[ "$PROFILE_UUID" == "$EXPECTED_PROFILE_UUID" ]]
          [[ "$TEAM_ID" == "$EXPECTED_TEAM_ID" ]]
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]]
          [[ "$APS_ENVIRONMENT" == "production" ]]

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: 生成 Xcode 工程
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sips -z 1024 1024 \
            CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon-Source.png \
            --out CustomerServiceApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          xcodegen generate --spec project.yml
          xcodebuild -project CustomerServiceApp.xcodeproj -scheme CustomerServiceApp -showBuildSettings >/dev/null

      - name: 编译并归档
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CustomerServiceApp.xcodeproj \
            -scheme CustomerServiceApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CustomerServiceApp.xcarchive" \
            clean archive \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ steps.signing.outputs.bundle_id }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            CODE_SIGN_IDENTITY='iPhone Distribution'

      - name: 导出 IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ steps.signing.outputs.team_id }}</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ steps.signing.outputs.bundle_id }}</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/CustomerServiceApp.xcarchive" \
            -exportPath build/ipa \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: 校验 IPA 签名和包名
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_IPA=$(find build/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          [[ -n "$ORIGINAL_IPA" ]]
          FINAL_IPA="build/ipa/CustomerService-iOS-1.0.8-ad-hoc.ipa"
          if [[ "$ORIGINAL_IPA" != "$FINAL_IPA" ]]; then
            mv "$ORIGINAL_IPA" "$FINAL_IPA"
          fi

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$FINAL_IPA" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$APP_PATH" ]]
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          [[ "$ACTUAL_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]]
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          ACTUAL_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded-profile.plist")
          [[ "$ACTUAL_PROFILE_UUID" == "$EXPECTED_PROFILE_UUID" ]]

          shasum -a 256 "$FINAL_IPA" > "$FINAL_IPA.sha256.txt"
          {
            echo "bundle_id=$ACTUAL_BUNDLE_ID"
            echo "team_id=$EXPECTED_TEAM_ID"
            echo "profile_uuid=$ACTUAL_PROFILE_UUID"
            echo "apns_environment=production"
            echo "git_commit=$GITHUB_SHA"
          } > build/ipa/build-info.txt

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomerService-iOS-1.0.8-ad-hoc
          path: build/ipa/
          if-no-files-found: error
          retention-days: 30

      - name: 清理临时钥匙串
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
